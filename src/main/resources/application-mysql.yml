# 生产环境 profile：切换到 MySQL 8.0。
# 使用：java -jar metadata-compare.jar --spring.profiles.active=mysql
# 数据库需提前由 DBA 执行 db/schema.sql 建表；本 profile 关闭 Spring 自动建表。
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/dqc?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: dqc
    password: dqc_pass
  sql:
    init:
      mode: never
  mail:
    # 企业 SMTP（Foxmail 配置），部署前确认服务器地址与端口
    host: smtp.exmail.qq.com
    port: 465
    username: dqc@your-company.com
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: false
          ssl:
            enable: true

app:
  input:
    base-dir: /data/input
  rules:
    path: /opt/dqc/rules/compare-rules.yml
  ticket:
    no-prefix: RT
