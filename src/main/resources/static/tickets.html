<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>复核工单 · 元数据比对系统</title>
  <style>
    :root{--pri:#4f46e5;--crit:#e11d48;--warn:#d97706;--ok:#059669;--txt:#1e293b;--mut:#64748b;--line:#e8ecf3;--bg:#f1f5f9;--card:#fff}
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);line-height:1.6}
    .nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:0 26px;height:62px;display:flex;align-items:center;justify-content:space-between}
    .nav .brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:16px}
    .nav .brand .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--pri),#7c3aed);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
    .nav a{color:var(--mut);text-decoration:none;font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;margin-left:8px}
    .nav a:hover{color:var(--pri);border-color:#c7d2fe;background:#eef2ff}
    .wrap{max-width:1120px;margin:0 auto;padding:26px 22px 50px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:20px}
    .card h3{margin:0 0 4px;font-size:15.5px;font-weight:700}
    .sub{margin:0 0 12px;color:var(--mut);font-size:13px}
    table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
    th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
    th{background:#f8fafc;font-size:12.5px;color:var(--mut)}
    tbody tr:hover{background:#fafbff}
    .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
    .pill.CRITICAL{background:#fff1f2;color:var(--crit)} .pill.WARNING{background:#fffbeb;color:var(--warn)} .pill.INFO{background:#eef2ff;color:var(--pri)}
    .pill.PENDING{background:#fffbeb;color:var(--warn)} .pill.CONFIRMED{background:#ecfdf5;color:var(--ok)} .pill.REJECTED,.pill.IGNORED{background:#f1f5f9;color:var(--mut)}
    button{background:linear-gradient(135deg,var(--pri),#7c3aed);color:#fff;border:0;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;font-weight:600}
    button.ghost{background:#fff;color:var(--pri);border:1px solid #c7d2fe}
    select,input,textarea{font-size:13px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:#f8fafc}
    select:focus,input:focus,textarea:focus{outline:none;border-color:var(--pri-soft,#6366f1);background:#fff}
    .muted{color:var(--mut);font-size:13px}
    .err{color:var(--crit);font-size:13px;margin:8px 0}
    .form-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
    .msg{font-size:13px;margin:8px 0}
  </style>
</head>
<body>
<nav class="nav">
  <div class="brand"><span class="mark">单</span>元数据自动化比对</div>
  <div>
    <a href="/">控制台</a>
    <a href="/tasks.html">任务列表</a>
    <a href="/logout">退出登录</a>
  </div>
</nav>
<div class="wrap">
  <div class="card">
    <h3>复核工单</h3>
    <p class="sub">系统自动识别出的严重问题会生成工单。请逐条确认：属实（确认）、误报（驳回）或暂不处理（忽略），并填写处理人意见。</p>
    <div class="form-row">
      <span class="muted">状态筛选：</span>
      <select id="statusSel" onchange="loadTickets()">
        <option value="">全部</option>
        <option value="PENDING" selected>待复核</option>
        <option value="CONFIRMED">已确认</option>
        <option value="REJECTED">已驳回</option>
        <option value="IGNORED">已忽略</option>
      </select>
      <button class="ghost" onclick="loadTickets()">刷新</button>
    </div>
    <div id="ticketBox" class="muted" style="margin-top:10px">加载中…</div>
  </div>
</div>
<script>
async function get(url){
  const res = await fetch(url);
  if (res.status === 401) { throw new Error('登录已过期，请重新登录'); }
  if (!res.ok) { throw new Error('请求失败：' + res.status); }
  return res.json();
}
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(t){ return t ? String(t).replace('T',' ').substring(0,19) : '-'; }
function pill(v){ return '<span class="pill ' + esc(v) + '">' + esc(v) + '</span>'; }

async function loadTickets(){
  const box = document.getElementById('ticketBox');
  box.innerHTML = '加载中…';
  const status = document.getElementById('statusSel').value;
  try {
    const tickets = await get('/api/tickets?status=' + encodeURIComponent(status) + '&page=1&size=500');
    if (!tickets.length) { box.innerHTML = '<span class="muted">当前筛选条件下没有工单。</span>'; return; }
    let html = '<table><thead><tr><th>工单号</th><th>级别</th><th>表</th><th>字段</th><th>问题描述</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody>';
    for (const t of tickets) {
      html += '<tr><td>' + esc(t.ticketNo) + '</td><td>' + pill(t.severity) + '</td><td>' + esc(t.tableName)
        + '</td><td>' + esc(t.fieldName || '(整表)') + '</td><td class="muted">' + esc(t.message) + '</td><td>' + pill(t.status)
        + '</td><td>' + fmt(t.createTime) + '</td>'
        + '<td><button class="ghost" onclick="review(' + t.id + ')">' + (t.status === 'PENDING' ? '复核' : '查看/改') + '</button></td></tr>';
      if (t.reviewComment) {
        html += '<tr><td colspan="8" class="muted">处理人：' + esc(t.assignee || '-') + ' ｜ 意见：' + esc(t.reviewComment) + '</td></tr>';
      }
    }
    html += '</tbody></table>';
    box.innerHTML = html;
  } catch (e) {
    box.innerHTML = '<div class="err">' + esc(e.message) + '</div><p class="muted">请回到控制台重新登录后访问。</p>';
  }
}

let reviewingId = null;
async function review(id){
  if (reviewingId) { document.getElementById('form-' + reviewingId)?.remove(); }
  reviewingId = id;
  const row = event.target.closest('tr');
  const form = document.createElement('tr');
  form.id = 'form-' + id;
  form.innerHTML = '<td colspan="8"><div class="form-row">'
    + '<span class="muted">复核结果：</span>'
    + '<select id="rv-status"><option value="CONFIRMED">确认属实</option><option value="REJECTED">驳回（误报）</option><option value="IGNORED">忽略（暂不处理）</option></select>'
    + '<input id="rv-reviewer" placeholder="处理人姓名" />'
    + '<textarea id="rv-comment" rows="2" style="min-width:280px" placeholder="处理意见（必填）"></textarea>'
    + '<button onclick="submitReview(' + id + ')">提交</button>'
    + '<button class="ghost" onclick="document.getElementById(\'form-' + id + '\').remove(); reviewingId=null">取消</button>'
    + '</div></td>';
  row.after(form);
}

async function submitReview(id){
  const status = document.getElementById('rv-status').value;
  const reviewer = document.getElementById('rv-reviewer').value.trim();
  const comment = document.getElementById('rv-comment').value.trim();
  if (!reviewer) { alert('请填写处理人姓名'); return; }
  if (!comment) { alert('请填写处理意见'); return; }
  try {
    const res = await fetch('/api/tickets/' + id + '/review', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status, reviewer, comment })
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      alert('提交失败：' + (d.error || res.status));
      return;
    }
    reviewingId = null;
    loadTickets();
  } catch (e) { alert('提交失败：' + e.message); }
}

loadTickets();
// 自动刷新：页面可见时每 60 秒重载工单列表；有复核表单打开时暂停，避免打断输入
setInterval(() => {
  if (document.visibilityState === 'visible' && !reviewingId) { loadTickets(); }
}, 30000);
</script>
</body>
</html>
