<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>比对任务 · 元数据比对系统</title>
  <style>
    :root{--pri:#4f46e5;--crit:#e11d48;--warn:#d97706;--ok:#059669;--txt:#1e293b;--mut:#64748b;--line:#e8ecf3;--bg:#f1f5f9;--card:#fff}
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);line-height:1.6}
    .nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:0 26px;height:62px;display:flex;align-items:center;justify-content:space-between}
    .nav .brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:16px}
    .nav .brand .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--pri),#7c3aed);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
    .nav a{color:var(--mut);text-decoration:none;font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;margin-left:8px}
    .nav a:hover{color:var(--pri);border-color:#c7d2fe;background:#eef2ff}
    .wrap{max-width:1120px;margin:0 auto;padding:26px 22px 50px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:20px}
    .card h3{margin:0 0 4px;font-size:15.5px;font-weight:700}
    .sub{margin:0 0 12px;color:var(--mut);font-size:13px}
    table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
    th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
    th{background:#f8fafc;font-size:12.5px;color:var(--mut)}
    tbody tr:hover{background:#fafbff}
    .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
    .pill.SUCCESS{background:#ecfdf5;color:var(--ok)} .pill.FAILED{background:#fff1f2;color:var(--crit)} .pill.RUNNING{background:#eef2ff;color:var(--pri)}
    .pill.CRITICAL{background:#fff1f2;color:var(--crit)} .pill.WARNING{background:#fffbeb;color:var(--warn)} .pill.INFO{background:#eef2ff;color:var(--pri)}
    .pill.PENDING{background:#fffbeb;color:var(--warn)} .pill.CONFIRMED{background:#ecfdf5;color:var(--ok)} .pill.REJECTED,.pill.IGNORED{background:#f1f5f9;color:var(--mut)}
    button{background:linear-gradient(135deg,var(--pri),#7c3aed);color:#fff;border:0;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;font-weight:600}
    button.ghost{background:#fff;color:var(--pri);border:1px solid #c7d2fe}
    .muted{color:var(--mut);font-size:13px}
    details{margin-top:8px} summary{cursor:pointer;color:var(--pri);font-size:13px;font-weight:600}
    .err{color:var(--crit);font-size:13px;margin:8px 0}
    .stat-row{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap}
    .stat{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px}
    .stat b{font-size:18px;margin-right:4px}
  </style>
</head>
<body>
<nav class="nav">
  <div class="brand"><span class="mark">比</span>元数据自动化比对</div>
  <div>
    <a href="/">控制台</a>
    <a href="/tickets.html">待复核工单</a>
    <a href="/logout">退出登录</a>
  </div>
</nav>
<div class="wrap">
  <div class="card">
    <h3>比对任务列表</h3>
    <p class="sub">每次定时巡检或手动触发都会产生一条任务记录，点「查看结果」看命中明细，「历史对比」看相对上一次的变化。</p>
    <div id="taskBox" class="muted">加载中…</div>
  </div>
  <div class="card" id="detailCard" style="display:none">
    <h3 id="detailTitle">任务明细</h3>
    <div id="detailBox" class="muted"></div>
  </div>
</div>
<script>
async function get(url){
  const res = await fetch(url);
  if (res.status === 401) { throw new Error('登录已过期，请重新登录'); }
  if (!res.ok) { throw new Error('请求失败：' + res.status); }
  return res.json();
}
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(t){ return t ? String(t).replace('T',' ').substring(0,19) : '-'; }
function pill(v){ return '<span class="pill ' + esc(v) + '">' + esc(v) + '</span>'; }

async function loadTasks(){
  const box = document.getElementById('taskBox');
  try {
    const tasks = await get('/api/compare/tasks');
    if (!tasks.length) { box.innerHTML = '<span class="muted">暂无任务记录，先到控制台「触发一次比对」。</span>'; return; }
    let html = '<table><thead><tr><th>ID</th><th>任务名称</th><th>状态</th><th>问题总数</th><th>严重</th><th>警告</th><th>工单</th><th>开始时间</th><th>结束时间</th><th>操作</th></tr></thead><tbody>';
    for (const t of tasks) {
      html += '<tr><td>' + t.id + '</td><td>' + esc(t.taskName) + '</td><td>' + pill(t.status)
        + '</td><td>' + (t.totalCount ?? 0) + '</td><td>' + (t.criticalCount ?? 0) + '</td><td>' + (t.warningCount ?? 0)
        + '</td><td>' + (t.ticketCount ?? 0) + '</td><td>' + fmt(t.startTime) + '</td><td>' + fmt(t.endTime) + '</td>'
        + '<td><button class="ghost" style="margin-right:6px" onclick="showResults(' + t.id + ')">查看结果</button>'
        + '<button class="ghost" onclick="showDiff(' + t.id + ')">历史对比</button></td></tr>';
      if (t.errorMessage) { html += '<tr><td colspan="10" class="err">错误：' + esc(t.errorMessage) + '</td></tr>'; }
    }
    html += '</tbody></table>';
    box.innerHTML = html;
  } catch (e) {
    box.innerHTML = '<div class="err">' + esc(e.message) + '</div><p class="muted">请回到控制台重新登录后访问。</p>';
  }
}

async function showResults(taskId){
  document.getElementById('detailCard').style.display = '';
  document.getElementById('detailTitle').textContent = '任务 ' + taskId + ' 命中明细';
  const box = document.getElementById('detailBox');
  box.innerHTML = '加载中…';
  try {
    const rs = await get('/api/compare/tasks/' + taskId + '/results?page=1&size=500');
    if (!rs.length) { box.innerHTML = '<span class="muted">本次无命中。</span>'; return; }
    let html = '<table><thead><tr><th>级别</th><th>规则</th><th>表</th><th>字段</th><th>说明</th></tr></thead><tbody>';
    for (const r of rs) {
      html += '<tr><td>' + pill(r.severity) + '</td><td>' + esc(r.ruleName) + '</td><td>' + esc(r.tableName)
        + '</td><td>' + esc(r.fieldName || '(整表)') + '</td><td class="muted">' + esc(r.message) + '</td></tr>';
    }
    html += '</tbody></table>';
    box.innerHTML = html;
  } catch (e) { box.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
}

async function showDiff(taskId){
  document.getElementById('detailCard').style.display = '';
  document.getElementById('detailTitle').textContent = '任务 ' + taskId + ' 历史对比（与上一成功任务）';
  const box = document.getElementById('detailBox');
  box.innerHTML = '加载中…';
  try {
    const d = await get('/api/compare/tasks/' + taskId + '/history-diff');
    let html = '<div class="stat-row">'
      + '<div class="stat"><b>' + (d.added||[]).length + '</b>新增问题</div>'
      + '<div class="stat"><b>' + (d.persistent||[]).length + '</b>持续存在</div>'
      + '<div class="stat"><b>' + (d.resolved||[]).length + '</b>已解决</div></div>';
    if ((d.added||[]).length) { html += renderGroup('🆕 新增', d.added); }
    if ((d.persistent||[]).length) { html += renderGroup('⏳ 持续存在', d.persistent); }
    if ((d.resolved||[]).length) { html += renderGroup('✅ 已解决', d.resolved); }
    if (!(d.added||[]).length && !(d.persistent||[]).length && !(d.resolved||[]).length) { html += '<span class="muted">无历史数据可对比。</span>'; }
    box.innerHTML = html;
  } catch (e) { box.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
}

function renderGroup(title, list){
  let html = '<details open><summary>' + title + '（' + list.length + '）</summary><table><thead><tr><th>级别</th><th>规则</th><th>表</th><th>字段</th><th>说明</th></tr></thead><tbody>';
  for (const r of list) {
    html += '<tr><td>' + pill(r.severity) + '</td><td>' + esc(r.ruleName) + '</td><td>' + esc(r.tableName)
      + '</td><td>' + esc(r.fieldName || '(整表)') + '</td><td class="muted">' + esc(r.message) + '</td></tr>';
  }
  return html + '</tbody></table></details>';
}

loadTasks();
// 自动刷新：页面可见时每 60 秒重载任务列表（不打断已展开的明细）
setInterval(() => {
  if (document.visibilityState === 'visible') { loadTasks(); }
}, 60000);
</script>
</body>
</html>
