server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: metadata-compare
  # 文件上传大小限制（网页上传元数据文件用）
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  # 默认 H2（MySQL 兼容模式），开箱即跑；生产用 --spring.profiles.active=mysql
  datasource:
    # DB_CLOSE_DELAY=-1：内存库在 JVM 生命周期内持久存活。
    # 否则当连接池因时钟回拨等触发软驱逐、所有连接被关闭时，H2 会销毁整个内存库，导致表丢失、接口 500。
    url: jdbc:h2:mem:dqc;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      encoding: UTF-8
  h2:
    console:
      enabled: true
      path: /h2-console
  # 邮件：默认未配置 SMTP，将优雅降级（仅记录日志不发信）。
  # 需要发信时用环境变量注入即可，例如（QQ/Foxmail 个人邮箱，密码为“授权码”而非登录密码）：
  #   MAIL_HOST=smtp.qq.com MAIL_PORT=465 MAIL_USER=you@foxmail.com MAIL_PASSWORD=<授权码>
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          ssl:
            enable: ${MAIL_SMTP_SSL:true}

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# ===== 业务配置 =====
app:
  # 输入文件根目录（按文档 2.4 规范）
  input:
    base-dir: ./data/input
  # 登录鉴权（一期收尾）：默认启用。生产务必修改 password；本地演示可设 enabled: false
  security:
    enabled: true
    user: admin
    password: admin123
  # 规则文件：文件系统路径，支持热加载（每分钟检测变更）；首次启动会自动从 classpath 拷贝
  rules:
    path: ./rules/compare-rules.yml
    hot-reload-seconds: 60
  # 定时调度：每 N 秒扫描一次到期任务
  scheduler:
    poll-seconds: 30
  # 对外访问地址：邮件里工单链接的域名前缀（部署到云服务器后改成实际域名/IP）
  base-url: http://localhost:8090
  # 数据保留策略（自动清理，0 = 不清理）
  retention:
    task-days: 365      # 任务与结果保留天数，到期每天 03:30 自动清理
    ticket-days: 0      # 工单保留天数；0 = 永久保留（复核审计留痕），需要清理时改为 N 天
  # 复核工单编号前缀
  ticket:
    no-prefix: RT
  # 单条规则执行超时（毫秒）
  rule:
    timeout-ms: 3000

logging:
  level:
    root: INFO
    com.dqc.compare: DEBUG
